name: Cross Compile

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  cross-compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            toolchain: native
          - os: ubuntu-22.04
            platform: windows-x64
            toolchain: mingw
          - os: macos-13
            platform: macos-arm64
            toolchain: native
          - os: macos-13
            platform: macos-x64
            toolchain: native

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-13'
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          mkdir -p build/${{ matrix.platform }}
          cd build/${{ matrix.platform }}

          case "${{ matrix.platform }}" in
            windows-x64)
              cmake \
                -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchains/x86_64-w64-mingw32.cmake \
                -C ../cmake/standalone-release.cmake \
                -G Ninja \
                ..
              ;;
            macos-arm64)
              cmake \
                -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchains/aarch64-apple-darwin.cmake \
                -C ../cmake/standalone-release.cmake \
                -G Ninja \
                ..
              ;;
            macos-x64)
              cmake \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -C ../cmake/standalone-release.cmake \
                -G Ninja \
                ..
              ;;
            linux-x64)
              cmake \
                -C ../cmake/standalone-release.cmake \
                -G Ninja \
                ..
              ;;
          esac

      - name: Build
        run: |
          cd build/${{ matrix.platform }}
          ninja -j$(nproc)

      - name: Test build output
        run: |
          cd build/${{ matrix.platform }}
          find . -name "*.a" -o -name "*.dll" -o -name "*.dylib" -o -name "*.exe" | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rawspeed-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/lib/
          retention-days: 30

      - name: Create release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release/${{ matrix.platform }}
          cp -r build/${{ matrix.platform }}/lib/* release/${{ matrix.platform }}/ 2>/dev/null || true
          cp -r build/${{ matrix.platform }}/bin/* release/${{ matrix.platform }}/ 2>/dev/null || true

          # 创建压缩包
          cd release
          tar -czf rawspeed-${{ matrix.platform }}-$(date +%Y%m%d).tar.gz ${{ matrix.platform }}/

          # 显示文件信息
          ls -la ${{ matrix.platform }}/
          du -sh ${{ matrix.platform }}/

      - name: Upload release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rawspeed-${{ matrix.platform }}-release
          path: release/rawspeed-${{ matrix.platform }}-*.tar.gz
          retention-days: 90
